name: Build Taskora APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore taskora-release.jks \
            -alias taskora \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass TaskoraStore2026 \
            -keypass TaskoraKey2026 \
            -dname "CN=Taskora, OU=Taskora, O=Taskora, L=Sanaa, ST=Sanaa, C=YE"

      - name: Build signed APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/taskora-release.jks
          KEYSTORE_PASSWORD: TaskoraStore2026
          KEY_ALIAS: taskora
          KEY_PASSWORD: TaskoraKey2026
        run: gradle :app:assembleRelease --no-daemon

      - name: Show generated APK
        run: find app/build/outputs/apk -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: taskora-release-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
